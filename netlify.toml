# Base directory Netlify UI : laisser vide (racine du repo).
# Publish directory : apps/web/out

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && NEXT_PUBLIC_STATIC_EXPORT=true NEXT_PUBLIC_PORTFOLIO_MODE=true NEXT_PUBLIC_BASE_PATH= NEXT_PUBLIC_VORZIX_URL=https://vorzix.com NEXT_PUBLIC_SITE_URL=\"$URL\" pnpm build:web:portfolio"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION = "22"
