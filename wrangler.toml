# Cloudflare Pages (site statique Next.js)
#
# Dashboard → Settings → Builds :
#   Build command      : pnpm build:netlify
#   Build output       : apps/web/out
#   Deploy command     : pnpm deploy:cloudflare
#   (NE PAS utiliser   : npx wrangler deploy)
#
# Environment variables :
#   NODE_VERSION=22
#   NEXT_PUBLIC_STATIC_EXPORT=true
#   NEXT_PUBLIC_PORTFOLIO_MODE=true
#   NEXT_PUBLIC_BASE_PATH=
#   NEXT_PUBLIC_VORZIX_URL=https://vorzix.com

name = "savoraille"
pages_build_output_dir = "apps/web/out"
compatibility_date = "2024-01-01"
