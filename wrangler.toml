# Cloudflare Pages — build settings (dashboard)
# Build command: pnpm build:netlify
# Build output: apps/web/out
# Root directory: (vide)
#
# Environment variables:
# NODE_VERSION=22
# NEXT_PUBLIC_STATIC_EXPORT=true
# NEXT_PUBLIC_PORTFOLIO_MODE=true
# NEXT_PUBLIC_BASE_PATH=
# NEXT_PUBLIC_VORZIX_URL=https://vorzix.com
# NEXT_PUBLIC_SITE_URL (optionnel — CF_PAGES_URL est détecté automatiquement)

name = "savoraille"
pages_build_output_dir = "apps/web/out"
compatibility_date = "2024-01-01"

[vars]
NEXT_PUBLIC_STATIC_EXPORT = "true"
NEXT_PUBLIC_PORTFOLIO_MODE = "true"
NEXT_PUBLIC_BASE_PATH = ""
NEXT_PUBLIC_VORZIX_URL = "https://vorzix.com"
